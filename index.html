<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const lsG=k=>{try{return localStorage.getItem(k)}catch{return null}},lsS=(k,v)=>{try{localStorage.setItem(k,v)}catch{}};
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const ST=[['todo','To do'],['doing','In progress'],['review','Review'],['done','Done']],FLD=['title','desc','assignee','status','priority','due','tag','checks'],TAGS=['Feature','Bug','Design','Docs','Ops'];
const S={projects:[],tasks:[],comments:[],files:[],members:[],rules:[],audit:[]};let db,room,sample,view='dash',pid=null,q='',mine=false,open=null,me=lsG('sb_name')||'Guest'+Math.floor(Math.random()*900+100),online=false;

const av=n=>n?`<span class="av" style="background:${colr(n)}" title="${esc(n)}">${esc(n.slice(0,2).toUpperCase())}</span>`:'';
const toast=m=>{const d=document.createElement('div');d.textContent=m;$('#toast').append(d);setTimeout(()=>d.remove(),3500)};
const today=()=>new Date().toISOString().slice(0,10);
const late=t=>t.due&&t.status!=='done'&&t.due<today();

/* ---- tiny local fallback so the app still works when signed out ---- */
function localDb(){const d={},sb={};const snap=c=>({docs:Object.entries(d[c]||{}).map(([id,v])=>({id,data:()=>v}))});
 const note=c=>(sb[c]||[]).forEach(f=>f());
 const doc=(c,id)=>({id,get:async()=>({exists:!!(d[c]||{})[id],data:()=>(d[c]||{})[id]}),set:async x=>{(d[c]=d[c]||{})[id]={...x};note(c)},update:async x=>{d[c][id]={...d[c][id],...x};note(c)},delete:async()=>{delete d[c][id];note(c)}});
 return{doc:p=>doc(...p.split('/')),collection:c=>({doc:id=>doc(c,id),add:async x=>{const r=doc(c,uid());await r.set(x);return r},onSnapshot(n){(sb[c]=sb[c]||[]).push(()=>n(snap(c)));setTimeout(()=>n(snap(c)));return()=>{}}})}}

/* ---- data layer ---- */
let off=false,outbox=JSON.parse(lsG('sb_out')||'[]');
const C=n=>{const c=db.collection(n),mk=id=>{const d=c.doc(id),w=(op,x)=>off?qOp(op,n,id,x):(op==='set'?d.set(x):op==='update'?d.update(x):d.delete());return{id,get:()=>off?Promise.resolve({exists:!!S[n].find(z=>z.id===id),data:()=>S[n].find(z=>z.id===id)}):d.get(),set:x=>w('set',x),update:x=>w('update',x),delete:()=>w('delete')}};return{onSnapshot:(...a)=>c.onSnapshot(...a),doc:mk,add:async x=>{const id=uid();await mk(id).set(x);return mk(id)}}};
function qOp(op,n,id,x){outbox.push({op,n,id,x,ts:Date.now()});lsS('sb_out',JSON.stringify(outbox));const a=S[n],i=a.findIndex(z=>z.id===id);if(op==='delete'){if(i>-1)a.splice(i,1)}else if(i>-1)a[i]={...a[i],...x};else a.push({id,...x});render();netUI();return Promise.resolve()}
async function flush(){const q=outbox;outbox=[];lsS('sb_out','[]');off=false;for(const o of q){const d=db.collection(o.n).doc(o.id);try{o.op==='set'?await d.set(o.x):o.op==='update'?await d.update(o.x):await d.delete()}catch{}}netUI();render();toast(q.length?`Synced ${q.length} offline change(s)`:'Back online')}
function watch(name){C(name).onSnapshot(s=>{if(off)return;
 const old=Object.fromEntries(S[name].map(x=>[x.id,x]));
 S[name]=s.docs.map(d=>({id:d.id,...d.data()}));if(name==='members')memsLoaded=true;
 if(name==='tasks'&&s.docChanges)s.docChanges().forEach(c=>{const t=c.doc.data();if(c.type==='modified'&&t&&t.by&&t.by!==me){toast(`${t.by} updated “${t.title}”`);if(open&&open.id===c.doc.id)remoteTouched(t)}if(c.type==='added'&&old&&Object.keys(old).length&&t.by!==me)toast(`${t.by} added “${t.title}”`)});
 if(pid&&!S.projects.find(p=>p.id===pid)){pid=null;view='dash'}
 render()},e=>{setLive(false)})}
function setLive(on,t){online=on;try{netUI()}catch{};$('#live').classList.toggle('off',!on);$('#livet').textContent=t||(on?'Live · real-time sync':'Local mode')}

/* ---- rendering ---- */
function prog(pj){const t=S.tasks.filter(x=>x.project===pj);return t.length?Math.round(100*t.filter(x=>x.status==='done').length/t.length):0}
function render(){
 $('#plist').innerHTML=S.projects.map(p=>`<button class="nav ${view==='proj'&&pid===p.id?'on':''}" data-p="${p.id}">${esc(p.emoji||'📁')} ${esc(p.name)}<div class="pbar"><b style="width:${prog(p.id)}%"></b></div></button>`).join('');
 document.querySelectorAll('[data-v]').forEach(b=>b.classList.toggle('on',b.dataset.v===view));
 if(document.activeElement&&document.activeElement.id==='srch'){const v=document.activeElement.value,pos=document.activeElement.selectionStart;draw();const e=$('#srch');e.focus();e.setSelectionRange(pos,pos)}else draw();
 if(open)updBanner()}
function draw(){const p=S.projects.find(x=>x.id===pid);
 if(view==='dash')dash();else if(view==='proj')p?board():empty('Create or pick a project to open the Kanban board');else if(view==='mx')matrix();else if(view==='acc')accel();else if(view==='vault')vault();else if(view==='ai')chatView()}
const empty=m=>$('#main').innerHTML=`<div class="card empty"><h2>${m}</h2><button class="btn" id="newp">＋ New project</button> <button class="btn g" id="demo">Load demo data</button></div>`;

/* ---- task modal with conflict-safe saving ---- */
let base=null,isNew=false,remoteMsg='';
const members=()=>S.members.map(m=>m.name);
function openTask(id,status){
 isNew=!id;const t=id?S.tasks.find(x=>x.id===id):{id:uid(),project:pid,title:'',desc:'',assignee:'',status:status||'todo',priority:'med',due:'',tag:'',checks:'[]'};if(!t)return;
 open=t;base={...t};remoteMsg='';room&&room.presence({name:me,task:t.id});
 const cs=S.comments.filter(x=>x.task===t.id).sort((a,b)=>a.at-b.at),fs=S.files.filter(x=>x.task===t.id);
 $('#sheet').innerHTML=`<div class="top"><h1>${isNew?'New task':'Task'}</h1><span id="ring"></span><span id="who" class="chip"></span><button class="btn g" data-act="aisub">✨ Subtasks</button><button class="btn g" data-act="tts">🔊</button><button class="btn g" id="x">✕</button></div><div id="banner"></div>
 <div class="f"><div class="full"><label>Title</label><input class="in" id="f_title" value="${esc(t.title)}"></div>
 <div class="full"><label>Description</label><textarea class="in" id="f_desc" rows="3">${esc(t.desc)}</textarea></div>
 <div><label>Assignee</label><select class="in" id="f_assignee"><option value="">Unassigned</option>${[...new Set([...members(),t.assignee].filter(Boolean))].map(m=>`<option ${t.assignee===m?'selected':''}>${esc(m)}</option>`).join('')}</select></div>
 <div><label>Status</label><select class="in" id="f_status">${ST.map(([k,l])=>`<option value="${k}" ${t.status===k?'selected':''}>${l}</option>`).join('')}</select></div>

 <div><label>Deadline</label><input type="date" class="in" id="f_due" value="${esc(t.due)}"></div>
 <div><label>Label</label><select class="in" id="f_tag"><option value="">None</option>${TAGS.map(k=>`<option ${t.tag===k?'selected':''}>${k}</option>`).join('')}</select></div>

 <div style="display:flex;gap:8px"><button class="btn" id="save">Save</button>${isNew?'':'<button class="btn g" id="del">Delete</button>'}</div>
 ${isNew?'':`<h3 style="margin-top:18px">Files</h3><div id="fl">${fs.map(f=>`<div class="row"><a href="${esc(f.url)}" download="${esc(f.name)}">📎 ${esc(f.name)}</a><span>${esc(f.by)}</span></div>`).join('')}</div><input type="file" id="up"> <small style="color:var(--mu)">max 150 KB each</small>
 <h3 style="margin-top:18px">Comments</h3><div id="cl">${cs.map(c=>`<div class="cm"><small>${av(c.by)} ${esc(c.by)} · ${new Date(c.at).toLocaleString()}</small><div>${esc(c.text)}</div></div>`).join('')}</div>
 <div>${['👍','🎉','🔥','✅','❤️','👀','🚀'].map(e=>`<button class="btn g" data-act="emo" data-e="${e}" style="padding:2px 8px">${e}</button>`).join(' ')}</div><div style="display:flex;gap:8px;margin-top:6px"><input class="in" id="cin" placeholder="Write a comment…"><button class="btn" id="cadd">Send</button></div>`}`;
 $('#modal').classList.add('show');updBanner();ckRender()}
function closeTask(){open=null;$('#modal').classList.remove('show');room&&room.presence({name:me,task:null})}
const form=()=>Object.fromEntries(FLD.map(f=>[f,($('#f_'+f)||{}).value||'']));
function remoteTouched(t){const ch=FLD.filter(f=>(t[f]||'')!==(base[f]||''));remoteMsg=`${t.by} just changed ${ch.join(', ')||'this task'}.`;updBanner()}
function updBanner(){const b=$('#banner');if(b)b.innerHTML=remoteMsg?`<div class="warn">⚡ ${esc(remoteMsg)} Your unsaved edits are kept — saving merges field-by-field and asks you to resolve true conflicts.</div>`:'';
 const w=$('#who');if(w&&open){const o=(window._peers||[]).filter(p=>!p.isMe&&p.presence&&p.presence.task===open.id);w.textContent=o.length?'👀 '+o.map(p=>p.presence.name).join(', ')+' viewing':''}}
async function save(){
 if(role==='Viewer')return toast('Read-only: Viewer role');const m=form();if(!m.title.trim())return toast('Title required');
 if(isNew){const id=open.id;await C('tasks').doc(id).set({...m,project:pid,by:me,at:Date.now(),rev:1});fire({id,...m,project:pid},'created');closeTask();return}
 const tid=open.id,ref=C('tasks').doc(open.id),cur=(await ref.get()).data();if(!cur){toast('Task was deleted by someone else');return closeTask()}
 const mineCh=FLD.filter(f=>m[f]!==(base[f]||'')),conf=mineCh.filter(f=>(cur[f]||'')!==(base[f]||'')&&(cur[f]||'')!==m[f]);
 const write=async over=>{const upd={};mineCh.forEach(f=>upd[f]=m[f]);Object.assign(upd,over);await ref.update({...upd,by:me,at:Date.now(),rev:(cur.rev||0)+1});closeTask();toast('Saved — merged with latest');if(m.status==='done'&&base.status!=='done')boom();if(m.status!==base.status)fire({...cur,...m,id:tid},'status:'+m.status)};
 if(!conf.length)return write({});
 $('#banner').innerHTML=`<div class="warn"><b>Conflict:</b> someone edited the same field(s) while you did. Choose which to keep:${conf.map(f=>`<div style="margin-top:6px"><b>${f}</b><br><label><input type="radio" name="c_${f}" value="t" checked> Theirs: ${esc(cur[f])||'—'}</label><br><label><input type="radio" name="c_${f}" value="m"> Mine: ${esc(m[f])||'—'}</label></div>`).join('')}<button class="btn" id="resolve" style="margin-top:8px">Apply choices</button></div>`;
 $('#resolve').onclick=()=>{const over={};conf.forEach(f=>{if(document.querySelector(`[name=c_${f}]:checked`).value==='t')over[f]=cur[f]||''});write(over)}}

 if(e.key==='Enter'&&e.target.id==='ckin'&&e.target.value.trim()){const a=ck();a.push({t:e.target.value.trim(),d:false});$('#f_checks').value=JSON.stringify(a);e.target.value='';ckRender();e.preventDefault()}
 if(!open&&view==='proj'&&!/INPUT|TEXTAREA|SELECT/.test(e.target.tagName)){if(e.key==='n')openTask();if(e.key==='/'){e.preventDefault();$('#srch')&&$('#srch').focus()}}if(e.key==='Escape'){closeTask();$('#m2').classList.remove('show')}});

function refreshPanels(){if(!open||isNew)return;const cs=S.comments.filter(x=>x.task===open.id).sort((a,b)=>a.at-b.at),fs=S.files.filter(x=>x.task===open.id);
 const cl=$('#cl');if(cl)cl.innerHTML=cs.map(c=>`<div class="cm"><small>${av(c.by)} ${esc(c.by)} · ${new Date(c.at).toLocaleString()}</small><div>${esc(c.text)}</div></div>`).join('');
 const fl=$('#fl');if(fl)fl.innerHTML=fs.map(f=>`<div class="row"><a href="${esc(f.url)}" download="${esc(f.name)}">📎 ${esc(f.name)}</a><span>${esc(f.by)}</span></div>`).join('')}
const _r=render;render=function(){_r();refreshPanels();if(logged&&!joined&&memsLoaded){joined=true;if(!S.members.some(m=>m.name===me))C('members').add({name:me,role:'Member',perm:role})}};
/* drag & drop — updates ONLY the status field, so it never clobbers other edits */
let drag=null,lv=false;
const ck=()=>{try{return JSON.parse($('#f_checks').value||'[]')}catch{return[]}};

const listv=T=>`<div class="card" style="overflow:auto"><table class="tb"><tr><th>Task</th><th>Status</th><th>Assignee</th><th>Priority</th><th>Due</th></tr>${T.map(t=>`<tr data-t="${t.id}"><td>${esc(t.title)} ${t.tag?`<span class="chip tg-${t.tag}">${t.tag}</span>`:''}</td><td>${(ST.find(s=>s[0]===t.status)||[])[1]}</td><td>${av(t.assignee)} ${esc(t.assignee||'—')}</td><td class="p-${t.priority}">${t.priority}</td><td class="${late(t)?'late':''}">${t.due||'—'}</td></tr>`).join('')}</table></div>`;

async function fire(t,evt){for(const r of S.rules){if(r.on===false||r.when!==evt||(r.ifp!=='any'&&r.ifp!==t.priority))continue;const ref=C('tasks').doc(t.id);let m='team notified';

const MODELS=[['claude','Claude · live (claude.ai only)'],['gpt-4o','ChatGPT · GPT-4o'],['gpt-4o-mini','ChatGPT · GPT-4o-mini'],['gemini-2.0-flash','Gemini 2.0 Flash'],['gemini-1.5-pro','Gemini 1.5 Pro']];

async function llm(p,ctx){const hist=chat.slice(-9,-1);while(hist.length&&hist[0].r==='a')hist.shift();const sys=`You are a concise project-management copilot. ${ctx}`;
 if(model==='claude'){if(!sample)throw new Error('Claude mode only works on the claude.ai-hosted page. Pick GPT or Gemini.');const r=await sample.json(`${sys}\nRecent chat: ${hist.map(m=>m.r+': '+m.t).join(' | ')}\nUser: ${p}\nReturn ONLY JSON: {"reply":"markdown answer"}`);return String(r.reply)}

 if(model.startsWith('gpt')){if(!ko)throw new Error('Add your OpenAI API key with the 🔑 button first.');const r=await fetch('https://api.openai.com/v1/chat/completions',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+ko},body:JSON.stringify({model,messages:[{role:'system',content:sys},...hist.map(m=>({role:m.r==='u'?'user':'assistant',content:m.t})),{role:'user',content:p}]})});const j=await r.json();if(!r.ok)throw new Error((j.error&&j.error.message)||'OpenAI error '+r.status);return j.choices[0].message.content}
 if(!kg)throw new Error('Add your Gemini API key with the 🔑 button first.');
 const r=await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${encodeURIComponent(kg)}`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({systemInstruction:{parts:[{text:sys}]},contents:[...hist.map(m=>({role:m.r==='u'?'user':'model',parts:[{text:m.t}]})),{role:'user',parts:[{text:p}]}]})});
 const j=await r.json();if(!r.ok)throw new Error((j.error&&j.error.message)||'Gemini error '+r.status);return j.candidates[0].content.parts.map(x=>x.text).join('')
 }catch(e){if(e instanceof TypeError)throw new Error('Network request blocked: the claude.ai-hosted page cannot call OpenAI/Gemini. Use the standalone file on your own domain.');throw e}}

{const th=lsG('sb_th');if(th)document.documentElement.dataset.theme=th;
